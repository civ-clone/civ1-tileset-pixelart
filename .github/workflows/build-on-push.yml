name: Build the pack on push

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@2.8.8 --config .prettierrc '**/*.js' --check
      # The committed sprites must be what the code draws.
      - run: npm run build
      - run: git diff --exit-code -- pack
      - run: test -z "$(git status --porcelain -- pack)"
